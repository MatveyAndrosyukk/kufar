name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf out; mkdir -p out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          K="https://api.kufar.by/search-api/v2/search/rendered-paginated?cat=1010&lang=ru&size=2&rgn=1"
          for q in "typ=let&rnt=1" "typ=let&rnt=2" "typ=let&rnt=3" "typ=let&rnt=4" "typ=let&flat_rent_type=2"; do curl -s -A "$UA" "$K&$q" | head -c 600 > "out/kufar_$(echo $q|tr '&=' '__').json"; echo >> "out/kufar_$(echo $q|tr '&=' '__').json"; done
          for u in "https://re.kufar.by/l/brest/snyat/kvartiru-posutochno" "https://re.kufar.by/l/brest/snyat/kvartiru-dolgosrochno" "https://realt.by/brest-region/rent/flat-for-long/" "https://realt.by/brest-region/rent/flat-for-day/" "https://realt.by/brest-region/sale/flats/" "https://realt.by/rent/flat-for-long/" "https://flatly.by/listings/606-kvartiry-dlya-rabochih-brigad-stroiteley-v-breste"; do
            f=out/$(echo "$u" | sed 's|https://||;s|[/?=]|_|g').html
            curl -sL -A "$UA" -H "Accept-Language: ru" -D "$f.headers" -o "$f" "$u" || true
          done
          ls -la out
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out && git commit -qm "probe results" && git push
