name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf out; mkdir -p out
          for n in kufarradarbot kufarscoutbot kufarpingbot kufaralertbot kufarwatchbot kufarhuntbot kufarnotifybot kufarspybot kufarfindbot kufarnowbot kufarfastbot kufarseekbot kufarnewbot mykufarbot kufarsledbot kufarlookbot kufarbeepbot kufareyebot kufarhawkbot; do
            h=$(curl -sL -m 20 -A "Mozilla/5.0" "https://t.me/$n")
            if echo "$h" | grep -q 'tgme_page_title'; then
              echo "TAKEN $n $(echo "$h" | grep -o '<div class="tgme_page_title"[^<]*<span[^>]*>[^<]*' | sed 's/.*>//')" >> out/names.txt
            else echo "FREE  $n" >> out/names.txt; fi
            sleep 1
          done
          cat out/names.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out && git commit -qm "probe results" && git push
