name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf out; mkdir -p out
          python3 probe_tools/realt_probe.py
          curl -s -A "Mozilla/5.0 Chrome/129" "https://flatly.by/?type=apartments" | grep -oE 'data-city="[^"]+"' | sort | uniq -c | sort -rn > out/flatly_cities.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out && git commit -qm "probe results" && git push
