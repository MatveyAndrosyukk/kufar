name: Deploy to server

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt bot token
        env:
          PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          T=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -A -pass env:PASS -in deploy/bot_token.enc)
          echo "::add-mask::$T"
          echo "BOT_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 194.87.78.244
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          envs: BOT_TOKEN
          script: |
            set -e
            curl -fsSL https://raw.githubusercontent.com/MatveyAndrosyukk/kufar/master/install.sh -o /tmp/kufar-install.sh
            bash /tmp/kufar-install.sh
            cd /opt/kufar-bot
            grep -q "^BOT_TOKEN=$BOT_TOKEN$" .env || sed -i "s|^BOT_TOKEN=.*|BOT_TOKEN=$BOT_TOKEN|" .env
            docker compose up -d
            docker compose ps
            echo ">> Аватарка бота"
            H=$(sha1sum deploy/avatar.jpg | cut -c1-40)
            if [ "$(cat data/.avatar 2>/dev/null)" != "$H" ]; then
              R=$(curl -s -F 'photo={"type":"static","photo":"attach://avatar"}' -F "avatar=@deploy/avatar.jpg" "https://api.telegram.org/bot$BOT_TOKEN/setMyProfilePhoto")
              echo "$R"
              echo "$R" | grep -q '"ok":true' && echo "$H" > data/.avatar
            fi
            test "$(cat data/.avatar 2>/dev/null)" = "$H" && echo "AVATAR_OK"
            echo ">> Проверка: бот подключился к Telegram"
            for i in $(seq 1 12); do docker compose logs bot 2>&1 | grep -q "Run polling" && break; sleep 5; done
            docker compose logs --tail 30 bot
            docker compose logs bot 2>&1 | grep -q "Run polling"
            echo ">> Проверка: Kufar API отвечает"
            docker compose exec -T bot python -c "import asyncio,kufar;ads=asyncio.run(kufar.search({'query':'квартира','region_id':1,'city':'Брест'}));print('KUFAR_OK',len(ads),[(a['subject'],kufar.location(a)) for a in ads[:3]]);assert ads,'no ads';assert all('брест' in str(kufar.location(a)).lower() for a in ads[:5]),'wrong region'"
