name: Deploy to server

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 194.87.78.244
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          envs: BOT_TOKEN
          script: |
            set -e
            curl -fsSL https://raw.githubusercontent.com/MatveyAndrosyukk/kufar/master/install.sh -o /tmp/kufar-install.sh
            bash /tmp/kufar-install.sh
            cd /opt/kufar-bot
            grep -q "^BOT_TOKEN=$BOT_TOKEN$" .env || sed -i "s|^BOT_TOKEN=.*|BOT_TOKEN=$BOT_TOKEN|" .env
            docker compose up -d
            docker compose ps
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
