name: Deploy to server

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt bot token
        env:
          PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          T=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -A -pass env:PASS -in deploy/bot_token.enc)
          echo "::add-mask::$T"
          echo "BOT_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 194.87.78.244
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          envs: BOT_TOKEN
          script: |
            set -e
            curl -fsSL https://raw.githubusercontent.com/MatveyAndrosyukk/kufar/master/install.sh -o /tmp/kufar-install.sh
            bash /tmp/kufar-install.sh
            cd /opt/kufar-bot
            grep -q "^BOT_TOKEN=$BOT_TOKEN$" .env || sed -i "s|^BOT_TOKEN=.*|BOT_TOKEN=$BOT_TOKEN|" .env
            docker compose up -d
            docker compose ps
