name: Deploy to server

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: deploy
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decrypt bot tokens
        env:
          PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          T=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -A -pass env:PASS -in deploy/bot_token.enc)
          F=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -A -pass env:PASS -in deploy/flats_token.enc)
          echo "::add-mask::$T"; echo "::add-mask::$F"
          echo "BOT_TOKEN=$T" >> "$GITHUB_ENV"
          echo "FLATS_BOT_TOKEN=$F" >> "$GITHUB_ENV"
      - name: Deploy via SSH
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          SSH="sshpass -e ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 root@194.87.78.244"
          $SSH "BOT_TOKEN='$BOT_TOKEN' FLATS_BOT_TOKEN='$FLATS_BOT_TOKEN' bash -s" < deploy/remote.sh || true
          $SSH "cat /tmp/deploy.log" | sed -e "s|$BOT_TOKEN|***|g" -e "s|$FLATS_BOT_TOKEN|***|g" -e "s|$SSHPASS|***|g" | tail -250 > /tmp/deploy.log
          cat /tmp/deploy.log
      - name: Save log
        if: always()
        run: |
          cp /tmp/deploy.log deploy.log || echo "no log" > deploy.log
          git config user.name deploy; git config user.email deploy@users.noreply.github.com
          git checkout -q --orphan deploy-log && git rm -rq --cached . && git add deploy.log
          git commit -qm "log ${GITHUB_SHA::7}" && git push -qf origin deploy-log
          grep -q DEPLOY_SUCCESS deploy.log
